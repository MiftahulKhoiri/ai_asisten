<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>AI Asisten</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div id="app">
  <header>
    <button class="ikon" id="btnMenu" aria-label="Riwayat">☰</button>
    <div class="judul"><b id="judulChat">AI Asisten</b><small id="subModel"></small></div>
    <a class="ikon" id="btnAgent" href="agent.html" aria-label="Buka halaman Agent">Agent</a>
    <button class="ikon" id="btnSelesai" hidden>Selesai</button>
  </header>

  <section class="layar" id="layar_token" hidden>
    <div class="tengah">
      <h2>Masukkan token</h2>
      <p class="redup">Token ada di terminal Raspberry Pi (baris "Buka dari HP"). Cukup sekali; tersimpan di browser ini.</p>
      <input type="password" id="tokenInput" placeholder="token" autocomplete="off">
      <button class="btn" id="btnToken">Masuk</button>
      <p id="tokenPesan" class="redup"></p>
    </div>
  </section>

  <section class="layar" id="layar_model" hidden>
    <div class="tengah">
      <h2>Pilih model</h2>
      <p class="redup">Model baru dimuat setelah kamu memilih, dan otomatis dibongkar saat sesi selesai.</p>
      <div id="skillBox">
        <div class="label">Skill (kemampuan) - boleh pilih lebih dari satu, sebelum memuat model</div>
        <div class="seg" id="seg">
          <button type="button" data-skill="tanpa"><b>Tanpa skill</b><small>Tanya jawab saja</small></button>
          <button type="button" data-skill="web"><b>Web</b><small id="nWeb">4 tool</small></button>
          <button type="button" data-skill="dasar"><b>Dasar</b><small id="nDasar">4 tool</small></button>
          <button type="button" data-skill="kompleks"><b>Kompleks</b><small id="nKompleks">27 tool</small></button>
          <button type="button" data-skill="kritis"><b>Berpikir kritis</b><small>Periksa &amp; perbaiki jawaban</small></button>
        </div>
        <p id="skillKet" class="redup kecil"></p>
      </div>
      <div id="modelPesan"></div>
      <div id="daftarModel"></div>
      <p id="modelInfo" class="redup kecil"></p>
      <button class="btn abu" id="btnMuatUlang" type="button" style="margin-top:12px">&#8635; Muat ulang daftar model</button>
    </div>
  </section>

  <section class="layar" id="layar_chat" hidden>
    <div id="pesan"></div>
    <form id="bawah" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Ketik perintah..."></textarea>
      <button class="btn" id="btnKirim" type="submit">Kirim</button>
    </form>
  </section>
</div>

<div id="tirai" hidden></div>
<aside id="drawer">
  <div class="atas">
    <button class="btn" id="btnBaru">+ Obrolan baru</button>
    <label class="saklar"><input type="checkbox" id="swAuto">
      <span>Mode AUTO<br><small>Tanpa konfirmasi (sudo, instal, hapus, git push, kill tetap tanya)</small></span></label>
    <input type="text" id="cari" placeholder="Cari obrolan..." autocomplete="off">
  </div>
  <div id="daftarChat"></div>
  <div class="bawah"><button class="btn abu" id="btnHapusSemua" type="button">Hapus semua obrolan</button></div>
</aside>
<div id="toast" hidden></div>

<script src="index.js"></script>
</body>
</html>
